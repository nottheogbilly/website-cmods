<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>CMods - Mods</title>
        <style>
            .logo a {
                font-size: 1.8rem;
                font-weight: bold;
                color: inherit;
                text-decoration: none;
            }
            .search-bar {
                width: 100%;
                padding: 10px 14px;
                margin: 16px 0 24px;
                font-size: 1rem;
                border: 1px solid #30363d;
                border-radius: 6px;
                background-color: #161b22;
                color: inherit;
            }
            .mod-card {
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 16px;
                margin-bottom: 16px;
                background-color: #161b22;
            }
            .mod-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
            }
            .mod-title {
                font-size: 1.25rem;
                font-weight: bold;
                margin: 0;
            }
            .mod-meta {
                font-size: 0.85rem;
                opacity: 0.75;
                margin-bottom: 10px;
            }
            .mod-download {
                display: inline-block;
                padding: 6px 14px;
                background-color: #2ea043;
                color: #ffffff;
                text-decoration: none;
                font-size: 0.9rem;
                font-weight: bold;
                border-radius: 6px;
            }
            .mod-download:hover {
                background-color: #268638;
            }
            .error-msg {
                color: #f85149;
            }
        </style>
    </head>
    <body>
        <nav class="navbar">
            <div class="logo"><a href="/">CMods</a></div>
            <ul class="nav-links">
                <li><a href="/mods">Browse Mods</a></li>
                <li><a href="/api">API Docs</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </nav>

        <main class="content">
            <h1>Find Lua mods made for <strong>BlocksC</strong>.</h1>

            <input type="text" id="searchInput" class="search-bar" placeholder="Search mods by name, author, or description...">

            <div id="modList">
                <p>Loading mods...</p>
            </div>
        </main>

        <script>
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str ?? '';
                return div.innerHTML;
            }

            async function loadMods() {
                const modList = document.getElementById('modList');
                try {
                    const response = await fetch('/mods/mods.json');
                    if (!response.ok) throw new Error('Failed to load mods.json');
                    const mods = await response.json();
                    renderMods(mods);
                } catch (err) {
                    modList.innerHTML = `<p class="error-msg">Could not load mods. Make sure <code>/mods/mods.json</code> exists and your web server is running.</p>`;
                }
            }

            function renderMods(mods) {
                const modList = document.getElementById('modList');
                if (!mods || mods.length === 0) {
                    modList.innerHTML = '<p>No mods found.</p>';
                    return;
                }

                modList.innerHTML = mods.map(mod => {
                    const searchTerms = `${mod.name} ${mod.author} ${mod.description}`.toLowerCase();
                    return `
                        <div class="mod-card" data-search="${escapeHtml(searchTerms)}">
                            <div class="mod-header">
                                <h2 class="mod-title">${escapeHtml(mod.name)}</h2>
                                <a href="${escapeHtml(mod.downloadUrl)}" class="mod-download" download>Download</a>
                            </div>
                            <div class="mod-meta">By <strong>${escapeHtml(mod.author)}</strong> • ${escapeHtml(mod.version)} • ${escapeHtml(mod.gameVersion)}</div>
                            <p>${escapeHtml(mod.description)}</p>
                        </div>
                    `;
                }).join('');
            }

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.toLowerCase();
                const cards = document.querySelectorAll('.mod-card');
                cards.forEach(card => {
                    const searchData = card.getAttribute('data-search') || '';
                    card.style.display = searchData.includes(query) ? 'block' : 'none';
                });
            });

            loadMods();
        </script>
    </body>
</html>
